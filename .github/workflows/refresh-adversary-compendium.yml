name: Refresh Homebrew Compendiums

on:
  schedule:
    - cron: '0 14 1,15 * *'  # 1st and 15th of each month at 10am ET (14:00 UTC)
  workflow_dispatch:        # Manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Download spreadsheet
        run: |
          curl -sL -o /tmp/adversary-sheet.xlsx \
            "https://docs.google.com/spreadsheets/d/1v-w7FDshDTHNeUfQCivfJXWHy-yW8DsHS41cVS8Peq0/export?format=xlsx"

      - name: Build compendium JSON
        run: |
          python scripts/build_adversary_database.py /tmp/adversary-sheet.xlsx
          python scripts/build_item_compendium.py /tmp/adversary-sheet.xlsx

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add break-homebrew-adversary-compendium.json break-homebrew-item-compendium.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(compendium): refresh homebrew data"
            git push
          fi
