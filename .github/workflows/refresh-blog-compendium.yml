name: Refresh BREAK!! blog compendium sources

on:
  schedule:
    - cron: '0 7 1 * *'   # 07:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture manifest-selected posts
        run: python capture-additional-posts.py
        working-directory: break-blog-compilation
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add break-blog-compilation/source-posts/*.json
          if git diff --cached --quiet; then
            echo "No compendium source changes."
          else
            git commit -m "chore(blog-compendium): refresh captured sources"
            git push
          fi