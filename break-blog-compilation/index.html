<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A topical reader for the BREAK!! Devblog archive.">
    <title>BREAK!! Blog Compendium</title>
    <link rel="stylesheet" href="styles.css?v=20260926-toc-loading">
</head>
<body>
    <div class="mobile-scrim" id="mobile-scrim" aria-hidden="true"></div>

    <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of contents">
        <div class="sidebar-brand">
            <span class="brand-eyebrow">BREAK!!</span>
            <strong>Blog Compilation</strong>
        </div>

        <nav class="toc-sidebar-content" id="toc-sidebar-content" aria-label="Compendium contents">
            <div class="toc-loading" id="toc-loading" aria-live="polite">
                <span class="toc-loading-spinner" aria-hidden="true"></span>
                <span id="toc-loading-text">Loading contents...</span>
            </div>
        </nav>

        <div class="sidebar-controls">
            <button class="control-button control-button-primary" id="print-button" type="button">
                Print / Save PDF
            </button>
        </div>
    </aside>

    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open contents" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <main class="book-container" id="book-container">
        <div class="book-pages" id="book-pages">
            <section class="loading-page" aria-live="polite">
                <p>Loading compendium</p>
                <span id="loading-status">Preparing the first category</span>
            </section>
        </div>
    </main>

    <div class="zoom-controls" aria-label="Zoom controls">
        <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">-</button>
        <button class="zoom-level" id="zoom-level" type="button" aria-label="Reset zoom" title="Reset zoom">100%</button>
        <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
