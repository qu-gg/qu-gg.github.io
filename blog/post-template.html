<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Studio Quagg</title>
    <meta name="description" content="{{SUMMARY}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{SUMMARY}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{URL}}">
    <meta property="og:site_name" content="Studio Quagg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{SUMMARY}}">
    <link rel="stylesheet" href="../../style.css">
    <link rel="alternate" type="application/rss+xml" title="Studio Quagg Blog Feed" href="../feed.xml">
    <script data-goatcounter="https://quagg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        .blog-post-page {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ── Post header ───────────────────────────────────── */
        .post-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .post-header h1 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 0.75rem;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .post-date {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .post-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .blog-tag {
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent);
        }

        /* ── Post body typography ──────────────────────────── */
        .post-content {
            font-size: 1rem;
            line-height: 1.75;
            color: var(--text-primary);
        }

        .post-content h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin: 2.5rem 0 1rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--border);
        }

        .post-content h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            margin: 2rem 0 0.75rem;
        }

        .post-content p {
            margin-bottom: 1.25rem;
        }

        .post-content a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .post-content a:hover {
            color: var(--accent-hover);
        }

        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem auto;
            border: 1px solid var(--border);
            display: block;
        }

        .post-content figure {
            margin: 1.5rem auto;
            text-align: center;
        }

        .post-content figure img {
            margin-bottom: 0.5rem;
        }

        .post-content figcaption {
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent);
            margin: 1.5rem 0;
            padding: 0.75rem 1.25rem;
            background: var(--bg-secondary);
            border-radius: 0 6px 6px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .post-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .post-content pre {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            margin: 1.5rem 0;
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .post-content code {
            font-size: 0.88em;
            background: var(--bg-secondary);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .post-content pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: inherit;
        }

        .post-content ul,
        .post-content ol {
            margin: 1rem 0 1.25rem 1.5rem;
        }

        .post-content li {
            margin-bottom: 0.4rem;
        }

        .post-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        /* ── Post navigation ───────────────────────────────── */
        .post-nav {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .post-nav-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            max-width: 45%;
        }

        .post-nav-link:hover {
            text-decoration: underline;
        }

        .post-nav-link.next {
            text-align: right;
            margin-left: auto;
        }

        @media (max-width: 600px) {
            .post-header h1 {
                font-size: 1.75rem;
            }

            .post-nav {
                flex-direction: column;
            }

            .post-nav-link {
                max-width: 100%;
            }

            .post-nav-link.next {
                text-align: left;
            }
        }

        /* ── Item / Ability card blocks ────────────────────────── */
        .item-block {
            background: var(--bg-secondary);
            border: 2px dotted var(--border);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin: 1.5rem 0;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .item-block .item-name {
            font-weight: 700;
            color: var(--accent);
        }

        .item-block .item-type {
            color: var(--text-secondary);
            font-size: 0.85em;
        }

        .item-block .item-desc {
            margin: 0.4rem 0;
            font-style: italic;
            color: var(--text-secondary);
        }

        .item-block .item-effect {
            margin: 0.4rem 0;
        }

        .item-block .item-stats {
            color: #00b894;
            font-weight: 600;
            margin-top: 0.4rem;
        }

        .item-block ul {
            margin: 0.4rem 0;
            padding-left: 1.25rem;
        }

        .item-block li {
            margin-bottom: 0.25rem;
        }

        /* ── Spoiler text ──────────────────────────────────── */
        .spoiler {
            background: var(--text-primary);
            color: transparent;
            border-radius: 3px;
            padding: 0 0.25rem;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .spoiler a {
            color: inherit;
            text-decoration: none;
            pointer-events: none;
        }

        .spoiler:hover,
        .spoiler:focus,
        .spoiler.revealed {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .spoiler:hover a,
        .spoiler:focus a,
        .spoiler.revealed a {
            color: var(--accent);
            text-decoration: underline;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">Studio Quagg</a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../../break.html">BREAK!! Homebrew</a></li>
                <li><a href="../../imperium-shipyard.html">Imperium-Shipyard [MgT1E]</a></li>
                <li><a href="../../bnb-loot-generator.html">B&B Loot Generator</a></li>
            </ul>
        </div>
    </nav>

    <main class="blog-post-page">
        <a href="../" class="back-link">← Back to Blog</a>

        <article>
            <header class="post-header">
                <h1>{{TITLE}}</h1>
                <div class="post-meta">
                    <span class="post-date">{{DATE}}</span>
                    <div class="post-tags">{{TAGS}}</div>
                </div>
            </header>

            <div class="post-content">
                {{CONTENT}}
            </div>

            {{POST_NAV}}
        </article>

        <!-- Comments -->
        <section class="comments-section">
            <h2>Comments</h2>
            <script src="https://giscus.app/client.js"
                data-repo="qu-gg/qu-gg.github.io"
                data-repo-id="MDEwOlJlcG9zaXRvcnkxNTg3NDE5NjY="
                data-category="Blog Comments"
                data-category-id="DIC_kwDOCXY1zs4C4zuu"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="0"
                data-emit-metadata="0"
                data-input-position="top"
                data-theme="light"
                data-lang="en"
                data-loading="lazy"
                crossorigin="anonymous"
                async>
            </script>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <nav class="webring" aria-label="Webring">
            <a href="https://rootr.ing/" class="webring-label">rootring</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/prev?site=http://its.quagg.studio/">Prev</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/random">Random</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/directory">Directory</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/next?site=http://its.quagg.studio/">Next</a>
        </nav>
        <p>© 2025 Studio Quagg</p>
    </footer>

    <script>
        document.querySelector('.nav-toggle').addEventListener('click', function() {
            this.classList.toggle('active');
            document.querySelector('.nav-links').classList.toggle('active');
        });

        // Spoiler text: toggle on click/tap for mobile support
        document.querySelectorAll('.spoiler').forEach(function(el) {
            el.addEventListener('click', function() {
                this.classList.toggle('revealed');
            });
        });
    </script>
</body>
</html>
