<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Studio Quagg</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="alternate" type="application/rss+xml" title="Studio Quagg Blog Feed" href="feed.xml">
    <script data-goatcounter="https://quagg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        .blog-page {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .blog-header {
            margin-bottom: 2rem;
        }

        .blog-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .blog-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .blog-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--bg-secondary);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-rss {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.75rem;
            align-self: stretch;
            background: #f26522;
            color: white;
            border-radius: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn-rss:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(242, 101, 34, 0.4);
        }

        .btn-rss svg {
            width: 15px;
            height: 15px;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .post-count {
            font-weight: 500;
        }

        .full-blog-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .full-blog-item {
            display: block;
            padding: 1.25rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }

        .full-blog-item:hover {
            border-color: #00b894;
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        .full-blog-item .blog-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .full-blog-item .blog-item-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .full-blog-item .blog-item-tags {
            font-size: 0.75rem;
            font-weight: 600;
            color: #00b894;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .full-blog-item .blog-item-title {
            font-size: 1.15rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .full-blog-item .blog-item-summary {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">Studio Quagg</a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../break.html">BREAK!! Homebrew</a></li>
                <li><a href="../imperium-shipyard.html">Imperium-Shipyard [MgT1E]</a></li>
                <li><a href="../bnb-loot-generator.html">B&B Loot Generator</a></li>
            </ul>
        </div>
    </nav>

    <main class="blog-page">
        <a href="../index.html" class="back-link">← Back to Home</a>

        <div class="blog-header">
            <h1>Blog</h1>
            <p>My personal musings on TTRPG homebrew and game design.</p>
        </div>

        <div class="blog-controls">
            <input type="text" id="search-input" class="search-input" placeholder="Search posts...">
            <a href="feed.xml" target="_blank" class="btn-rss" title="RSS Feed">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="6.18" cy="17.82" r="2.18"/>
                    <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/>
                </svg>
            </a>
        </div>

        <div class="blog-meta">
            <span class="post-count" id="post-count">Loading...</span>
        </div>

        <div class="full-blog-list" id="blog-list">
            <p class="no-results">Loading posts...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <nav class="webring" aria-label="Webring">
            <a href="https://rootr.ing/" class="webring-label">rootring</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/prev?site=https://its.quagg.studio">Prev</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/random">Random</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/directory">Directory</a>
            <span class="webring-sep">·</span>
            <a href="https://rootr.ing/next?site=https://its.quagg.studio">Next</a>
        </nav>
        <p>© 2025 Studio Quagg</p>
    </footer>

    <script>
        document.querySelector('.nav-toggle').addEventListener('click', function() {
            this.classList.toggle('active');
            document.querySelector('.nav-links').classList.toggle('active');
        });

        let allPosts = [];

        async function loadBlog() {
            try {
                const response = await fetch('../blog-data.json');
                const data = await response.json();
                allPosts = data.posts;
                renderPosts(allPosts);
            } catch (err) {
                document.getElementById('blog-list').innerHTML =
                    '<p class="no-results">Unable to load posts.</p>';
                document.getElementById('post-count').textContent = '';
            }
        }

        function filterPosts() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            let filtered = allPosts;

            if (searchTerm) {
                filtered = filtered.filter(p =>
                    p.title.toLowerCase().includes(searchTerm) ||
                    p.summary.toLowerCase().includes(searchTerm) ||
                    (p.tags && p.tags.some(t => t.toLowerCase().includes(searchTerm)))
                );
            }

            renderPosts(filtered);
        }

        function renderPosts(posts) {
            const list = document.getElementById('blog-list');
            document.getElementById('post-count').textContent = `${posts.length} post${posts.length !== 1 ? 's' : ''}`;

            if (posts.length === 0) {
                list.innerHTML = '<p class="no-results">No posts found matching your search</p>';
                return;
            }

            list.innerHTML = posts.map(post => {
                const d = new Date(post.date + 'T00:00:00');
                const dateStr = d.toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });
                const tagsStr = post.tags ? post.tags.join(', ') : '';
                return `
                    <a href="posts-html/${post.slug}.html" class="full-blog-item">
                        <div class="blog-item-header">
                            ${tagsStr ? `<span class="blog-item-tags">${tagsStr}</span>` : '<span></span>'}
                            <span class="blog-item-date">${dateStr}</span>
                        </div>
                        <h3 class="blog-item-title">${post.title}</h3>
                        <p class="blog-item-summary">${post.summary}</p>
                    </a>
                `;
            }).join('');
        }

        document.getElementById('search-input').addEventListener('input', filterPosts);

        loadBlog();
    </script>
</body>
</html>
